name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 云端编译 iOS 安装包
    runs-on: macos-14

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示编译环境
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 环境诊断（写入 Summary 供远程排错）
        run: |
          {
            echo '## 环境诊断'
            echo '```'
            echo '--- 仓库目录 ---'
            ls -la
            echo '--- 工程与 scheme 列表 ---'
            xcodebuild -project MsgBridge.xcodeproj -list 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译 App
        run: |
          xcodebuild \
            -project MsgBridge.xcodeproj \
            -scheme MsgBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > build_output.txt 2>&1
          CODE=$?
          echo "xcodebuild 退出码: $CODE"
          if [ $CODE -ne 0 ]; then
            {
              echo '## xcodebuild 完整输出（前 100KB）'
              echo '```'
              head -c 100000 build_output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "===== 命中的错误行（最多 8 条）====="
            grep -E "error:" build_output.txt | sort -u | head -8 | tee errors.txt
            if [ -s errors.txt ]; then
              while IFS= read -r line; do echo "::error::$line"; done < errors.txt
            else
              echo "===== 无 error 关键字，打印日志末尾 8 行 ====="
              tail -8 build_output.txt | while IFS= read -r line; do echo "::error::$line"; done
            fi
          fi
          exit $CODE

      - name: 打包成 ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MsgBridge.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "没有找到编译产物，编译可能失败了"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload MsgBridge.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MsgBridge.ipa Payload
          ls -lh MsgBridge.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MsgBridge-ipa
          path: MsgBridge.ipa
          retention-days: 30

      - name: 保存完整编译日志（排错用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: ignore
