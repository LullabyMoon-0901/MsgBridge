name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 云端编译 iOS 安装包
    runs-on: macos-14

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示编译环境
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          xcodegen --version

      - name: 环境诊断（结果存入 diag.txt）
        run: |
          {
            echo '=== ls 仓库根 ==='
            ls -la
            echo '=== 工程与 scheme 列表 ==='
            xcodebuild -project MsgBridge.xcodeproj -list 2>&1
            echo '=== project.pbxproj 头部 30 行 ==='
            head -30 MsgBridge.xcodeproj/project.pbxproj 2>&1
            echo '=== pbxproj 文件大小 ==='
            wc -c MsgBridge.xcodeproj/project.pbxproj 2>&1
          } > diag.txt 2>&1
          cat diag.txt
          exit 0

      - name: 编译 App
        run: |
          xcodebuild \
            -project MsgBridge.xcodeproj \
            -scheme MsgBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > build_output.txt 2>&1
          CODE=$?
          echo "xcodebuild 退出码: $CODE"
          exit $CODE

      - name: 打包成 ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MsgBridge.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "没有找到编译产物，编译可能失败了"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload MsgBridge.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MsgBridge.ipa Payload
          ls -lh MsgBridge.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MsgBridge-ipa
          path: MsgBridge.ipa
          retention-days: 30

      - name: 保存编译日志 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.txt
            diag.txt
          if-no-files-found: ignore

      - name: 把日志推回 ci-logs 分支（供远程排错）
        if: always()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add -f diag.txt build_output.txt
          if git diff --cached --quiet; then
            echo "没有新的日志可提交"
            exit 0
          fi
          git commit -m "ci: diagnostic logs [skip ci]"
          git push -f origin "HEAD:refs/heads/ci-logs"
