name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 云端编译 iOS 安装包
    runs-on: macos-14

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示编译环境
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 App
        run: |
          set -o pipefail
          xcodebuild \
            -project MsgBridge.xcodeproj \
            -scheme MsgBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40

      - name: 打包成 ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MsgBridge.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "没有找到编译产物，编译可能失败了"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload MsgBridge.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MsgBridge.ipa Payload
          ls -lh MsgBridge.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MsgBridge-ipa
          path: MsgBridge.ipa
          retention-days: 30
