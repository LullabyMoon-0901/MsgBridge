name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 云端编译 iOS 安装包
    runs-on: macos-14

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示编译环境
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          set +e
          set +o pipefail
          xcodegen generate
          xcodegen --version

          # 保险丝：确认生成的工程格式能被本机 Xcode 打开。
          # xcodegen 默认生成 objectVersion 77（Xcode 16 格式），
          # Xcode 15.x 会拒绝读取，这里强制降到 60（Xcode 15.0 格式）。
          PBX="MsgBridge.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            OV=$(grep -m1 -o 'objectVersion = [0-9]*' "$PBX" | grep -o '[0-9]*')
            echo "生成的 objectVersion = ${OV:-未知}"
            if [ -n "$OV" ] && [ "$OV" -gt 60 ]; then
              sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 60;/' "$PBX"
              sed -i '' 's/preferredProjectObjectVersion = [0-9]*;//' "$PBX"
              OV2=$(grep -m1 -o 'objectVersion = [0-9]*' "$PBX" | grep -o '[0-9]*')
              echo "已降级 objectVersion: $OV -> $OV2"
            fi
            echo "最终 objectVersion = $(grep -m1 -o 'objectVersion = [0-9]*' "$PBX" | grep -o '[0-9]*')"
          else
            echo "警告：没有生成 project.pbxproj"
          fi
          exit 0

      - name: 环境诊断（结果存入 diag.txt）
        run: |
          set +e
          set +o pipefail
          {
            echo '=== xcodebuild -version ==='
            xcodebuild -version 2>&1
            echo '=== ls 仓库根 ==='
            ls -la
            echo '=== 工程与 scheme 列表 ==='
            xcodebuild -project MsgBridge.xcodeproj -list 2>&1
            echo '=== project.pbxproj 头部 30 行 ==='
            head -30 MsgBridge.xcodeproj/project.pbxproj 2>&1
            echo '=== objectVersion / 兼容版本 ==='
            grep -m2 -E 'objectVersion|compatibilityVersion|preferredProjectObjectVersion' MsgBridge.xcodeproj/project.pbxproj 2>&1
            echo '=== pbxproj 大小 ==='
            wc -c MsgBridge.xcodeproj/project.pbxproj 2>&1
          } > diag.txt 2>&1
          cat diag.txt
          DIAG=$(head -c 3000 diag.txt)
          DIAG="${DIAG//$'\r'/}"
          DIAG="${DIAG//$'\n'/%0A}"
          echo "::notice::DIAG-BEGIN%0A${DIAG}%0A DIAG-END"
          exit 0

      - name: 编译 App
        run: |
          set +e
          set +o pipefail
          xcodebuild \
            -project MsgBridge.xcodeproj \
            -scheme MsgBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > build_output.txt 2>&1
          CODE=$?
          echo "xcodebuild 退出码: $CODE"
          if [ $CODE -ne 0 ]; then
            OUT=$(head -c 3000 build_output.txt)
            OUT="${OUT//$'\r'/}"
            OUT="${OUT//$'\n'/%0A}"
            echo "::error::BUILD-OUTPUT-BEGIN%0A${OUT}%0AEND"
          fi
          exit $CODE

      - name: 打包成 ipa
        run: |
          set +e
          APP_PATH="build/Build/Products/Release-iphoneos/MsgBridge.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "没有找到编译产物，编译可能失败了"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload MsgBridge.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MsgBridge.ipa Payload
          ls -lh MsgBridge.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MsgBridge-ipa
          path: MsgBridge.ipa
          retention-days: 30

      - name: 保存编译日志 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.txt
            diag.txt
          if-no-files-found: ignore

      - name: 把日志推回 ci-logs 分支
        if: always()
        run: |
          set +e
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add -f diag.txt 2>/dev/null
          git add -f build_output.txt 2>/dev/null
          if git diff --cached --quiet; then
            echo "没有新的日志可提交"
            exit 0
          fi
          git commit -m "ci: diagnostic logs [skip ci]"
          if git push -f origin "HEAD:refs/heads/ci-logs" 2> push_err.txt; then
            echo "日志已推送到 ci-logs 分支"
          else
            ERR=$(head -c 1200 push_err.txt)
            ERR="${ERR//$'\r'/}"
            ERR="${ERR//$'\n'/%0A}"
            echo "::error::PUSH-FAILED%0A${ERR}"
            exit 1
          fi
