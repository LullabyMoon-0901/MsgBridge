name: MsgBridge

options:
  bundleIdPrefix: com.msgbridge
  # 关键：xcodegen 默认按 Xcode 16 格式生成（objectVersion 77），
  # 而云端 macos-14 机器只有 Xcode 15.4，会报 "future Xcode project file format"。
  # 显式声明为 Xcode 15.0 格式（objectVersion 60）。
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  MsgBridge:
    type: application
    platform: iOS
    sources:
      - path: MsgBridge
        excludes:
          - "Info.plist"
    info:
      path: MsgBridge/Info.plist
      properties:
        CFBundleDisplayName: "工作消息桥"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msgbridge.app
        PRODUCT_NAME: MsgBridge
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  MsgBridge:
    build:
      targets:
        MsgBridge: all
    run:
      config: Release
    archive:
      config: Release
